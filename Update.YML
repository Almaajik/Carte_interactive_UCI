name: Mise à jour du calendrier

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours à 05:17 UTC
  workflow_dispatch:        # permet aussi de le lancer à la main

permissions:
  contents: write           # pour enregistrer data/races.json
  issues: write             # pour signaler les nouveautés

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python sync.py

      - name: Enregistrer les changements
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour du calendrier $(date -u +%F)"
            git push
          fi

      - name: Signaler les nouveautés
        if: hashFiles('data/last_changes.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "Calendrier mis à jour $(date -u +%F)" --body-file data/last_changes.md